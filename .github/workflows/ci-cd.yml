name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # Job 1: Lint and Run Security Audits
  # ==========================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Validations
      - name: Backend Security Check
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high || true

      # Frontend Validations
      - name: Frontend Security Check
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high || true

  # ==========================================
  # Job 2: Build & Push Production Images
  # ==========================================
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Log in to Docker Hub using secrets stored in GitHub settings
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Build & Push: Express Backend Service
      # ----------------------------------------
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Cache layers in GitHub Actions registry to speed up future runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-backend:${{ github.sha }}

      # ----------------------------------------
      # Build & Push: React Frontend Service
      # ----------------------------------------
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_SOCKET_URL=
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-frontend:${{ github.sha }}

      # ----------------------------------------
      # Build & Push: Nginx Ingress Gateway
      # ----------------------------------------
      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service-connect-gateway:${{ github.sha }}
